[project]
name = "moneymaker"
version = "0.1.0"
description = "Cross-venue prediction market arbitrage scanner (Kalshi / Polymarket US)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "websockets>=13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "cryptography>=43",
    "structlog>=24.4",
]

[project.scripts]
moneymaker = "moneymaker.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moneymaker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
